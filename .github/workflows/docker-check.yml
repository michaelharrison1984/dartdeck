name: Validate Docker build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'server.py'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker-check.yml'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Build DartDeck Docker image
        run: docker build -t dartdeck:0.9.0 .
      - name: Start container
        run: docker run -d --name dartdeck-ci -p 8788:8000 dartdeck:0.9.0
      - name: Health check
        shell: bash
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8788/health; then exit 0; fi
            sleep 1
          done
          docker logs dartdeck-ci
          exit 1
