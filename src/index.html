<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DartDeck" />
  <title>DartDeck</title>
  <link rel="manifest" href="./manifest.webmanifest?v=0.9.0" />
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/icon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css?v=0.9.0" />
</head>
<body class="local-first native-mobile">
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-icon" src="./icons/icon-64.png" alt=""><div><h1>DartDeck</h1><small>Score • Train • Compete</small></div></div>
      <nav class="nav">
        <button data-nav="home">Home</button>
        <button data-nav="players">Players</button>
        <button data-nav="stats">Stats</button>
        <button data-nav="settings">Settings</button>
        <button id="installApp" class="install-nav hidden">Install</button>
      </nav>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="./platform.js?v=0.9.0"></script>
  <script src="./store.js?v=0.9.0"></script>
  <script src="./app.js?v=0.9.0"></script>
</body>
</html>
